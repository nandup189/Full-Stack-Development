<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        a:link {
            color: red;
        }

        a:visited {
            color: blue;
        }

        a:hover {
            color: green;
        }
    </style>
</head>

<body>

    <h1>25K65A1207</h1>

    <p>
        <a href="https://www.google.com" target="_blank">
            Google
        </a>
    </p>

    <p>
        <a href="https://www.youtube.com" target="_blank">
            YouTube
        </a>
    </p>

    <p>
        <a href="https://www.wikipedia.org" target="_blank">
            Wikipedia
        </a>
    </p>

</body>
</html>
